{{ define "main" }}
<div id="tag-hero">
    <div class="container">
        <p class="hero-kicker">ls ~/torizon/rnd/blog/tags</p>
        <h1>Topics</h1>
        <p>Browse the engineering blog by tag.</p>
    </div>
</div>

<main class="container tag-page" id="posts-list">
    <div class="tag-cloud">
        {{ range .Pages.ByTitle }}
        <a class="tag-cloud-item" href="{{ .Permalink }}">
            <span class="tag-cloud-name">#{{ .Title }}</span>
            <span class="tag-cloud-count">{{ len .Pages }}</span>
        </a>
        {{ end }}
    </div>
</main>
{{ end }}
